# Log rotation for NeuroWealth AI Agent (#120).
#
# Installation:
#   sudo cp agent/logrotate.conf /etc/logrotate.d/neurowealth-agent
#
# Test without rotating:
#   sudo logrotate --debug /etc/logrotate.d/neurowealth-agent
#
# Force an immediate rotation (for testing):
#   sudo logrotate --force /etc/logrotate.d/neurowealth-agent

/var/log/neurowealth-agent/*.log {
    # Rotate once per day.
    daily

    # Keep 14 days of rotated logs.
    rotate 14

    # Compress rotated files with gzip.
    compress

    # Delay compression by one cycle so the current file can be read by
    # log shippers (Filebeat, Promtail, etc.) before it disappears.
    delaycompress

    # Do not error if the log file is missing (e.g. agent not yet started).
    missingok

    # Do not rotate if the log file is empty.
    notifempty

    # Create the new log file with the correct owner and permissions.
    create 0640 neurowealth neurowealth

    # After rotation, signal the agent to reopen its log file.
    # PM2 users: replace with 'pm2 reloadLogs' if using PM2.
    postrotate
        systemctl reload-or-restart neurowealth-agent 2>/dev/null || true
    endscript
}
