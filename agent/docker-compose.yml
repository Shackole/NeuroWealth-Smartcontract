version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neurowealth-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=neurowealth
    volumes:
      - ../db/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neurowealth"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/neurowealth
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
      - OPENAI_API_KEYS=sk-key1,sk-key2
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=30
      - USER_RATE_LIMIT_MAX_REQUESTS=20
      - MAX_DB_POOL_SIZE=10
      - MIN_DB_POOL_SIZE=2
      - JWT_SECRET=test_jwt_secret_key_12345
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
