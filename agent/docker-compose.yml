version: '3.8'

# NeuroWealth local development environment
# Usage: docker-compose up
# Requires: agent/.env.local (copy from .env.local.template)

services:
  # ─────────────────────────────────────────
  # PostgreSQL 15
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: neurowealth-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-neurowealth}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neurowealth}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: neurowealth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─────────────────────────────────────────
  # RedisInsight (Redis UI) — localhost:8001
  # ─────────────────────────────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: neurowealth-redisinsight
    restart: unless-stopped
    ports:
      - "8001:5540"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight_data:/data

  # ─────────────────────────────────────────
  # AI Agent (Node.js) — hot-reload dev mode
  # ─────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # use the builder stage so devDependencies are present
    container_name: neurowealth-agent
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.local        # loaded automatically; never committed
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-neurowealth}
      REDIS_URL: redis://redis:6379
    volumes:
      # Mount source so ts-node-dev hot-reloads on file changes
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
      # Persist node_modules inside the container (avoids host/container mismatch)
      - agent_node_modules:/app/node_modules
    command: >
      sh -c "npx prisma migrate deploy &&
             npx ts-node-dev --respawn --transpile-only src/index.ts"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
    name: neurowealth_pgdata
  redisdata:
    name: neurowealth_redisdata
  redisinsight_data:
    name: neurowealth_redisinsight_data
  agent_node_modules:
    name: neurowealth_agent_node_modules
