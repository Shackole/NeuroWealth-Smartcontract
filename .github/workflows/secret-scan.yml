name: Secret Scan

# Scans every PR and push for accidentally committed secrets (Issue #115).
# Uses gitleaks/gitleaks-action@v2 with the repo's .gitleaks.toml ruleset.
# - Full git history is fetched so every commit in the PR range is scanned.
# - Any finding fails the job and blocks merge.
# - A Slack alert is posted to the security channel on any finding.
#
# False-positive management:
#   Add fingerprints to .gitleaksignore with a justifying comment.
#   Review .gitleaksignore and .gitleaks.toml allowlists quarterly
#   (January / April / July / October).  See docs/SECRETS_HYGIENE.md.

on:
  pull_request:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "release/**"
  push:
    branches:
      - main
      - develop
  # Weekly re-sweep: catches new rules matching historical commits.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Needed to post a PR check annotation with file path + line number.
  statuses: write

jobs:
  # ---------------------------------------------------------------------------
  # gitleaks-pr: scans the diff introduced by this PR / push
  # ---------------------------------------------------------------------------
  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history is required so gitleaks can walk every commit in the
          # PR range, not just the merge result.
          fetch-depth: 0

      - name: Run gitleaks
        id: gitleaks
        # gitleaks-action exits 1 on any finding, which fails the job and
        # blocks merge when branch protection requires this check to pass.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Optional: set GITLEAKS_LICENSE if using the commercial version.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Write finding summary
        if: failure()
        run: |
          echo "## :rotating_light: Secret Scan Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "gitleaks detected one or more secrets in this PR/push." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Immediate actions:**" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Treat the exposed credential as compromised — rotate it now." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Remove the secret from the commit (amend / rebase / BFG)." >> "$GITHUB_STEP_SUMMARY"
          echo "3. If it is a false positive, add its fingerprint to \`.gitleaksignore\` with a justifying comment." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See \`docs/SECRETS_HYGIENE.md\` for the full runbook." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # full-history-scan: scheduled deep scan of the entire commit history
  # Runs weekly and on manual dispatch; not on every PR to keep latency low.
  # ---------------------------------------------------------------------------
  full-history-scan:
    name: Full History Secret Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history
        id: full_scan
        run: |
          set +e
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            .
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif-report
          path: gitleaks-report.sarif
          retention-days: 30

      - name: Open or update tracking issue on finding
        if: steps.full_scan.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Secret scan: gitleaks detected a finding in full history scan';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## :rotating_light: gitleaks full-history scan detected a finding',
              '',
              `Failing run: ${runUrl}`,
              '',
              '**Immediate actions:**',
              '1. Review the SARIF report attached to the workflow run.',
              '2. Treat any exposed credential as compromised and rotate it immediately.',
              '3. Remove the secret from git history (BFG / git-filter-repo).',
              '4. If this is a false positive, add the fingerprint to `.gitleaksignore`.',
              '',
              'See `docs/SECRETS_HYGIENE.md` for the full remediation runbook.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  # ---------------------------------------------------------------------------
  # notify-security: sends a Slack alert to the security channel on any finding
  # ---------------------------------------------------------------------------
  notify-security:
    name: Notify Security Channel
    runs-on: ubuntu-latest
    needs: [gitleaks-scan]
    if: failure() && needs.gitleaks-scan.result == 'failure'
    permissions: {}

    steps:
      - name: Post Slack alert
        # Only runs if SECURITY_SLACK_WEBHOOK_URL is configured.
        # Configure this secret in: Settings → Secrets → Actions.
        if: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}
        run: |
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}"
          REF="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"

          PAYLOAD=$(cat <<EOF
          {
            "text": ":rotating_light: *Secret Scan Alert* :rotating_light:",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":rotating_light: *Secret detected in <https://github.com/${REPO}|${REPO}>*\n\nBranch/ref: \`${REF}\`\nTriggered by: \`${ACTOR}\`\n\n*Treat the exposed credential as compromised and rotate it immediately.*\n\n<${RUN_URL}|View failing workflow run>"
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "See <https://github.com/${REPO}/blob/main/docs/SECRETS_HYGIENE.md|docs/SECRETS_HYGIENE.md> for the remediation runbook."
                  }
                ]
              }
            ]
          }
          EOF
          )

          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
