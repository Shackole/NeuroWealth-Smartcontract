name: Staging Deploy

on:
  push:
    branches: [staging]
  schedule:
    - cron: "23 * * * *"
  pull_request:
    paths:
      - '.github/workflows/staging.yml'
      - 'scripts/staging-inputs.py'
      - '.github/staging-input-matrix.json'
  workflow_dispatch:
    inputs:
      mode:
        description: Validate inputs only or deploy to staging
        type: choice
        required: true
        default: rehearse
        options: [rehearse, deploy, synthetic-read]
      scope:
        description: Deploy the contract only or run the full staging pipeline
        type: choice
        required: true
        default: full
        options: [full, contract-only]

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.mode == 'synthetic-read') && 'staging-synthetic-read' || (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy')) && 'staging-deploy' || format('staging-rehearsal-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate staging dispatch inputs
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.invocation.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the rehearsal matrix offline
        run: python3 scripts/staging-inputs.py --matrix .github/staging-input-matrix.json
      - name: Validate this invocation
        id: invocation
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'synthetic-read')
        env:
          MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
          SCOPE: ${{ github.event_name == 'push' && 'full' || inputs.scope }}
        run: |
          plan="$(python3 scripts/staging-inputs.py --mode="$MODE" --scope="$SCOPE")"
          echo "Staging plan: $plan"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

  deploy-contract:
    name: Deploy vault to Stellar testnet
    needs: validate-inputs
    if: needs.validate-inputs.outputs.plan == 'deploy-full' || needs.validate-inputs.outputs.plan == 'deploy-contract'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      contract-artifact: staging-contracts
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: |
          VERSION="$(tr -d '[:space:]' < .stellar-version)"
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          install stellar "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Deploy and initialize staging vault
        env:
          STAGING_DEPLOYER_SECRET_KEY: ${{ secrets.STAGING_DEPLOYER_SECRET_KEY }}
          STAGING_CONTRACTS_FILE: ${{ runner.temp }}/staging-contracts.env
        run: ./scripts/deploy-staging.sh

      - name: Upload staging contract configuration
        uses: actions/upload-artifact@v7
        with:
          name: staging-contracts
          path: |
            ${{ runner.temp }}/staging-contracts.env
            ${{ runner.temp }}/staging-contracts.env.manifest.json
          retention-days: 14

  deploy-services:
    name: Deploy frontend and agent
    needs: [validate-inputs, deploy-contract]
    if: needs.validate-inputs.outputs.plan == 'deploy-full'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Download staging contract configuration
        uses: actions/download-artifact@v8
        with:
          name: staging-contracts
          path: ${{ runner.temp }}/staging

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy frontend to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/staging/staging-contracts.env"
          npm ci
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SOROBAN_RPC_URL="$NEXT_PUBLIC_SOROBAN_RPC_URL" \
            --build-env NEXT_PUBLIC_SOROBAN_NETWORK_PASSPHRASE="$NEXT_PUBLIC_SOROBAN_NETWORK_PASSPHRASE" \
            --build-env NEXT_PUBLIC_VAULT_CONTRACT_ID="$NEXT_PUBLIC_VAULT_CONTRACT_ID"

      - name: Deploy agent to Railway staging service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_STAGING_SERVICE: ${{ vars.RAILWAY_STAGING_SERVICE }}
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          railway up agent --service "$RAILWAY_STAGING_SERVICE" \
            --environment staging --ci

  staging-e2e:
    name: Run Playwright against staging
    needs: deploy-services
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test deployed staging frontend
        working-directory: frontend
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: npm run test:e2e

  synthetic-vault-read:
    name: Probe the configured testnet vault
    if: github.event_name == 'schedule' || inputs.mode == 'synthetic-read'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      VAULT_CONTRACT_ID: ${{ vars.STAGING_VAULT_CONTRACT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Stellar CLI for the probe
        id: stellar
        run: |
          VERSION="$(tr -d '[:space:]' < .stellar-version)"
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          curl -fsSL --max-time 60 "https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/stellar-cli"
          STELLAR_BIN="$(find "$RUNNER_TEMP/stellar-cli" -type f -name stellar -print -quit)"
          chmod +x "$STELLAR_BIN"
          dirname "$STELLAR_BIN" >> "$GITHUB_PATH"

      - name: Simulate get_version and record the result
        if: ${{ !cancelled() }}
        env:
          CLI_INSTALL_OUTCOME: ${{ steps.stellar.outcome }}
        run: |
          network=testnet
          contract_id_display="(missing)"
          failure_class=none
          if [[ -n "$VAULT_CONTRACT_ID" ]]; then
            contract_id_display="(invalid)"
          fi

          if [[ ! "$VAULT_CONTRACT_ID" =~ ^C[A-Z2-7]{55}$ ]]; then
            failure_class=configuration
          else
            contract_id_display="$VAULT_CONTRACT_ID"
            if [[ "$CLI_INSTALL_OUTCOME" != success ]]; then
              failure_class=cli_setup
            elif version=$(timeout 45s stellar contract invoke --network "$network" \
                --id "$VAULT_CONTRACT_ID" --is-view -- get_version); then
              if [[ ! "$version" =~ ^[1-9][0-9]*$ ]]; then
                failure_class=unexpected_result
              fi
            elif [[ $? -eq 124 ]]; then
              failure_class=timeout
            else
              failure_class=read_failed
            fi
          fi

          {
            echo "## Synthetic vault read"
            echo
            echo "| Network | Contract ID | Failure class |"
            echo "| --- | --- | --- |"
            echo "| $network | $contract_id_display | $failure_class |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failure_class" != none ]]; then
            echo "::error::Synthetic vault read failed ($failure_class)"
            exit 1
          fi
