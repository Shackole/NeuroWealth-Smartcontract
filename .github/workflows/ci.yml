name: CI

on:
  push:
    branches: ["main", "develop", "feat/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

env:
  # Maximum allowed size in bytes for the optimised contract WASM.
  # Raise this in the same PR as any deliberate feature addition that grows
  # the binary, and document the reason in the PR description.
  WASM_SIZE_LIMIT_BYTES: 1500000

jobs:
  # Secret scan (#605): fails the build if any commit in the PR (or push)
  # introduces a Stellar secret seed, .env contents, or anything else the
  # gitleaks ruleset in .gitleaks.toml matches. Full history is fetched so
  # every commit in the range is scanned, not just the merge result.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  ci-matrix:
    name: CI Matrix
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read Stellar CLI version
        if: matrix.step == 'build-wasm'
        id: cli-version
        run: |
          VERSION=$(cat .stellar-version | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain with components
        if: matrix.working_directory == 'neurowealth-vault'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        if: matrix.working_directory == 'neurowealth-vault'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: neurowealth-vault

      - name: Cache cargo registry and tooling
        if: matrix.step == 'build-wasm'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.local/bin/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        if: matrix.step == 'build-wasm'
        run: |
          VERSION="${{ steps.cli-version.outputs.version }}"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          mv stellar "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Install wasm-opt
        if: matrix.step == 'build-wasm'
        run: cargo install wasm-opt --locked

      - name: Run ${{ matrix.name }}
        working-directory: ${{ matrix.working_directory }}
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/neurowealth-target
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # The subshell preserves a failing command's exit status while
          # recording its elapsed time before the matrix step exits.
          record_duration() (
            local label="$1"
            shift
            local started=$SECONDS
            trap 'status=$?; printf "| %s | %s s | %s |\n" "$label" "$((SECONDS - started))" "$status" >> "$RUNNER_TEMP/ci-durations.md"' EXIT
            "$@"
          )

          case "${{ matrix.step }}" in
            fmt)
              cargo fmt --all -- --check
              ;;
            clippy)
              cargo clippy --all-targets --all-features -- -D warnings -D clippy::all -D clippy::pedantic
              ;;
            test)
              record_duration "Rust tests (including compilation)" cargo test --verbose
              ;;
            doc)
              RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
              ;;
            vault-client-typecheck)
              npm ci
              npm run typecheck
              record_duration "Vault client tests" npm run test
              ;;
            vault-ui-test)
              npm install
              record_duration "Vault UI tests" npm run test
              ;;
            frontend-lint)
              npm ci
              npm run lint
              ;;
            build-wasm)
              RUSTFLAGS="-C target-cpu=mvp" record_duration "WASM compilation" cargo build \
                -p neurowealth-vault \
                --target wasm32-unknown-unknown \
                --release

              WASM_DIR="${CARGO_TARGET_DIR:-target}/wasm32-unknown-unknown/release"
              WASM_FILE="$WASM_DIR/neurowealth_vault.wasm"
              record_duration "WASM packaging (optimization)" wasm-opt --strip-target-features \
                "$WASM_FILE" \
                -o "$WASM_FILE"

              WASM_SIZE=$(stat -c%s "$WASM_FILE")
              LIMIT="${WASM_SIZE_LIMIT_BYTES:-1500000}"
              BASE_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
              BASELINE_PATH=".github/wasm-size-history.json"
              BASELINE_FILE="$GITHUB_WORKSPACE/$BASELINE_PATH"
              BASELINE_SIZE=""
              DELTA_DISPLAY="n/a"

              if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
                BASELINE_FILE="$RUNNER_TEMP/wasm-size-baseline.json"
                if ! git show "$PR_BASE_SHA:$BASELINE_PATH" > "$BASELINE_FILE"; then
                  rm -f "$BASELINE_FILE"
                fi
              fi

              if [ -f "$BASELINE_FILE" ]; then
                BASELINE_SIZE=$(python3 -c '
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as history:
              latest = json.load(history).get(sys.argv[2], {}).get("latest", {})
          size = latest.get("size_bytes")
          if type(size) is int and size > 0:
              print(size)
          ' "$BASELINE_FILE" "$BASE_BRANCH")
              fi

              if [ -z "$BASELINE_SIZE" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                BASE_WORKTREE="$RUNNER_TEMP/wasm-size-base"
                git worktree add --detach "$BASE_WORKTREE" "$PR_BASE_SHA"
                BASELINE_SIZE=$(
                  cd "$BASE_WORKTREE/neurowealth-vault"
                  export CARGO_TARGET_DIR="$RUNNER_TEMP/wasm-size-base-target"
                  RUSTFLAGS="-C target-cpu=mvp" cargo build \
                    -p neurowealth-vault --target wasm32-unknown-unknown --release
                  BASE_WASM="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/neurowealth_vault.wasm"
                  wasm-opt --strip-target-features "$BASE_WASM" -o "$RUNNER_TEMP/baseline.wasm"
                  stat -c%s "$RUNNER_TEMP/baseline.wasm"
                )
                git worktree remove --force "$BASE_WORKTREE"
              fi

              if [ -n "$BASELINE_SIZE" ]; then
                DELTA_BYTES=$((WASM_SIZE - BASELINE_SIZE))
                if [ "$DELTA_BYTES" -gt 0 ]; then
                  DELTA_DISPLAY="+$DELTA_BYTES bytes"
                elif [ "$DELTA_BYTES" -lt 0 ]; then
                  DELTA_DISPLAY="$DELTA_BYTES bytes"
                else
                  DELTA_DISPLAY="0 bytes"
                fi
              fi

              {
                echo "## WASM Size Report"
                echo ""
                echo "| Metric | Value |"
                echo "|--------|-------|"
                echo "| Optimised size | ${WASM_SIZE} bytes |"
                echo "| Configured threshold | ${LIMIT} bytes |"
                if [ -n "$BASELINE_SIZE" ]; then
                  echo "| Baseline (${BASE_BRANCH}) | ${BASELINE_SIZE} bytes |"
                  echo "| Delta vs ${BASE_BRANCH} | ${DELTA_DISPLAY} |"
                else
                  echo "| Baseline (${BASE_BRANCH}) | n/a |"
                  echo "| Delta vs ${BASE_BRANCH} | n/a |"
                fi
              } >> "$GITHUB_STEP_SUMMARY"

              if [ "$WASM_SIZE" -gt "$LIMIT" ]; then
                echo "| Status | :x: EXCEEDED |" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::Optimised WASM is ${WASM_SIZE} bytes, which exceeds the ${LIMIT}-byte limit. See docs/WASM_SIZE.md for reduction tips."
                exit 1
              else
                echo "| Status | :white_check_mark: OK |" >> "$GITHUB_STEP_SUMMARY"
                echo "Optimised WASM is ${WASM_SIZE} bytes — within the ${LIMIT}-byte limit."
              fi

              if [ "$GITHUB_EVENT_NAME" = "push" ] && { [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "develop" ]; }; then
                python3 "$GITHUB_WORKSPACE/scripts/update_wasm_baseline.py" "$WASM_SIZE" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$BASELINE_FILE"
              fi

              # Validate storage layout compatibility gate
              mkdir -p "$GITHUB_WORKSPACE/scripts/e2e-artifacts"
              python3 "$GITHUB_WORKSPACE/scripts/check-storage-layout.py" \
                "$WASM_FILE" \
                "$WASM_FILE" \
                --migration-doc "$GITHUB_WORKSPACE/docs/UPGRADE_MIGRATION.md" \
                --output "$GITHUB_WORKSPACE/scripts/e2e-artifacts/storage_layout_diff.txt"

              # Export the WASM path for the artifact upload step.
              echo "WASM_FILE=$WASM_FILE" >> "$GITHUB_ENV"
              ;;
            no-bare-panic)
              bash scripts/check-no-bare-panic.sh \
                neurowealth-vault/contracts/vault/src
              ;;
            stale-state-audit)
              bash scripts/check-stale-state-audit.sh \
                neurowealth-vault/contracts/vault/src/lib.rs
              ;;
            *)
              echo "Unknown step: ${{ matrix.step }}" >&2
              exit 1
              ;;
          esac

      - name: Upload optimised WASM artifact
        if: matrix.step == 'build-wasm'
        uses: actions/upload-artifact@v7
        with:
          name: neurowealth-vault-wasm
          path: ${{ env.WASM_FILE }}
          retention-days: 14

      - name: Publish runtime summary
        if: always() && (matrix.step == 'test' || matrix.step == 'build-wasm' || matrix.step == 'vault-client-typecheck' || matrix.step == 'vault-ui-test')
        run: |
          {
            echo "## Runtime summary"
            echo
            if [[ -s "$RUNNER_TEMP/ci-durations.md" ]]; then
              echo "| Step | Duration | Exit code |"
              echo "| --- | ---: | ---: |"
              cat "$RUNNER_TEMP/ci-durations.md"
            else
              echo "The timed steps did not start."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  kani-share-math:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    name: Kani Share-Accounting Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run Kani proofs
        uses: model-checking/kani-github-action@v1.1
        with:
          args: --manifest-path neurowealth-vault/Cargo.toml -p share-math

  cargo-deny:
    needs: changes
    if: needs.changes.outputs.rust_audit == 'true'
    name: Dependency Audit (cargo-deny)
    runs-on: ubuntu-latest
    # The workflow-level weekly cron (Sunday 03:00 UTC) re-runs this job
    # against a fresh RustSec advisory database, so advisories published
    # against pinned dependencies surface without waiting for a PR.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # The vault workspace manifest drives the dependency graph.
          manifest-path: ./neurowealth-vault/Cargo.toml
          # Policy lives in deny.toml at the repo root.
          command-arguments: "--config deny.toml"
          # Respect the [graph] settings in deny.toml instead of forcing
          # --all-features (the action's default).
          arguments: ""

      - name: Open or update advisory tracking issue
        # Only scheduled runs manage the tracking issue: a per-PR failure is
        # already visible on the PR itself, while a scheduled failure has no
        # PR to surface it and would otherwise go unnoticed.
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Scheduled cargo-deny audit is failing (dependency advisory drift)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The weekly scheduled `cargo deny check` run failed, meaning a new',
              'RustSec advisory (or license/ban/source violation) now applies to the',
              'pinned dependency graph even though no PR has touched it.',
              '',
              `- Failing run: ${runUrl}`,
              '- Policy: `deny.toml` (workspace: `neurowealth-vault/Cargo.toml`)',
              '',
              'Triage: inspect the run log for the advisory ID, then either upgrade',
              'the affected dependency or record a justified exception in',
              '`deny.toml`. Close this issue once a scheduled run passes again.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of the latest scheduled run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  reproducible-build:
    name: Reproducible Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Two clean uncached builds are expensive, so this runs where an
    # attestation matters — weekly, on demand, and on pushes to main —
    # rather than on every PR.
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-opt
        run: cargo install wasm-opt --locked

      # No build caches on purpose: a reproducibility attestation must come
      # from two genuinely clean builds.
      - name: Dual build + hash comparison
        run: bash scripts/check-reproducible-build.sh

  # README links can target files anywhere in the repository.
  readme-check:
    name: README Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate README
        run: bash scripts/check-readme.sh .

  security-audit:
    needs: changes
    if: needs.changes.outputs.security_docs == 'true'
    name: Security Documentation Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify access control table accuracy (spec)
        run: bash scripts/check-access-control.sh

      - name: Verify auth matrix against source (lib.rs)
        run: python3 scripts/check-auth-matrix.py

      - name: Verify DataKey::Balance deprecation
        run: bash scripts/check-balance-deprecation.sh

      - name: Verify DataKey docs match lib.rs
        run: bash scripts/check-data-key-docs.sh

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contract: ${{ steps.select.outputs.contract }}
      contract_changed: ${{ steps.filter.outputs.contract }}
      frontend: ${{ steps.select.outputs.frontend }}
      rust_audit: ${{ steps.select.outputs.rust_audit }}
      security_docs: ${{ steps.select.outputs.security_docs }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Group changed paths
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref_name == 'develop' && 'develop' || github.event.repository.default_branch }}
          filters: |
            # A CI workflow edit exercises every group. Rust tooling and the
            # contracts symlink are shared by the Cargo-based checks.
            ci:
              - '.github/workflows/ci.yml'
            contract:
              - 'neurowealth-vault/**'
              - 'contracts'
              - 'rust-toolchain*'
              - '.cargo/**'
            wasm:
              - 'neurowealth-vault/**'
              - 'contracts'
              - 'rust-toolchain*'
              - '.cargo/**'
              - '.stellar-version'
              - '.github/wasm-size-history.json'
              - 'scripts/check-storage-layout.py'
              - 'scripts/update_wasm_baseline.py'
              - 'docs/UPGRADE_MIGRATION.md'
            rust_audit:
              - 'neurowealth-vault/**'
              - 'contracts'
              - 'rust-toolchain*'
              - '.cargo/**'
              - 'deny.toml'
            panic_check:
              - 'neurowealth-vault/**'
              - 'contracts'
              - 'rust-toolchain*'
              - '.cargo/**'
              - 'scripts/check-no-bare-panic.sh'
            stale_check:
              - 'neurowealth-vault/**'
              - 'contracts'
              - 'rust-toolchain*'
              - '.cargo/**'
              - 'scripts/check-stale-state-audit.sh'
            # Both consumers install the vault client from a local file path.
            client:
              - 'packages/vault-client/**'
              - 'contract-spec.json'
              - 'shared/**'
              - 'package*.json'
              - 'tsconfig.json'
            ui:
              - 'packages/vault-client/**'
              - 'contract-spec.json'
              - 'shared/**'
              - 'package*.json'
              - 'tsconfig.json'
              - 'packages/vault-ui/**'
            frontend:
              - 'packages/vault-client/**'
              - 'contract-spec.json'
              - 'shared/**'
              - 'package*.json'
              - 'tsconfig.json'
              - 'frontend/**'
              - 'playwright.config.ts'
            security_docs:
              - 'ARCHITECTURE.md'
              - 'SECURITY.md'
              - 'contract-spec.json'
              - 'contracts'
              - 'neurowealth-vault/contracts/vault/src/**'
              - 'scripts/check-access-control.sh'
              - 'scripts/check-auth-matrix.py'
              - 'scripts/check-balance-deprecation.sh'
              - 'scripts/check-data-key-docs.sh'

      - name: Select workspace checks
        id: select
        env:
          CHANGED_GROUPS: ${{ steps.filter.outputs.changes || '[]' }}
          RUN_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci == 'true' }}
          RUN_E2E: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
        run: |
          if [[ "$RUN_ALL" == true ]]; then
            CHANGED_GROUPS='["contract","wasm","rust_audit","panic_check","stale_check","client","ui","frontend","security_docs"]'
          elif [[ "$RUN_E2E" == true ]]; then
            CHANGED_GROUPS=$(jq -c '. + ["wasm"]' <<< "$CHANGED_GROUPS")
          fi

          for group in contract frontend rust_audit security_docs; do
            selected=$(jq -c --arg group "$group" 'index($group) != null' <<< "$CHANGED_GROUPS")
            echo "$group=$selected" >> "$GITHUB_OUTPUT"
          done

          matrix=$(jq -nc --argjson groups "$CHANGED_GROUPS" '
            {include: [
              {"name": "Format Check", "step": "fmt", "working_directory": "neurowealth-vault", "group": "contract"},
              {"name": "Clippy Lint", "step": "clippy", "working_directory": "neurowealth-vault", "group": "contract"},
              {"name": "Tests", "step": "test", "working_directory": "neurowealth-vault", "group": "contract"},
              {"name": "Documentation Check", "step": "doc", "working_directory": "neurowealth-vault", "group": "contract"},
              {"name": "Vault Client Typecheck", "step": "vault-client-typecheck", "working_directory": "packages/vault-client", "group": "client"},
              {"name": "Vault UI Accessibility & Notifications", "step": "vault-ui-test", "working_directory": "packages/vault-ui", "group": "ui"},
              {"name": "Frontend Lint", "step": "frontend-lint", "working_directory": "frontend", "group": "frontend"},
              {"name": "Build WASM", "step": "build-wasm", "working_directory": "neurowealth-vault", "group": "wasm"},
              {"name": "No Bare Panic Check", "step": "no-bare-panic", "working_directory": ".", "group": "panic_check"},
              {"name": "Stale-State Audit Check", "step": "stale-state-audit", "working_directory": ".", "group": "stale_check"}
            ] | map(select(.group as $group | $groups | index($group)) | del(.group))}
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.contract == 'true')
    strategy:
      fail-fast: false
      matrix:
        target:
          - deposit_withdraw_sequence
          - rebalance_transitions
          - rounding_boundaries
          - share_accounting_invariants
          - agent_update_timelock
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: neurowealth-vault

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run ${{ matrix.target }} fuzz target (PR – short bounds)
        if: github.event_name == 'pull_request'
        working-directory: neurowealth-vault
        run: cargo fuzz run ${{ matrix.target }} -- -runs=1000 -max_total_time=120

      - name: Run ${{ matrix.target }} fuzz target (scheduled – full bounds)
        if: github.event_name == 'schedule'
        working-directory: neurowealth-vault
        run: cargo fuzz run ${{ matrix.target }} -- -runs=5000 -max_total_time=300

  e2e-devnet:
    name: E2E Devnet Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci-matrix, changes]
    # Trigger e2e-devnet on manual dispatch, weekly schedule, or PRs with 'run-e2e' label or contract modifications
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
        needs.changes.outputs.contract_changed == 'true'
      ))

    # Required secrets:
    # - SOROBAN_SECRET_KEY: Funded Stellar account secret key used by E2E script
    #                       to deploy and interact with the contracts on testnet.
    env:
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      SOROBAN_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Stellar CLI version
        id: cli-version
        run: |
          VERSION=$(cat .stellar-version | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: neurowealth-vault

      - name: Install Stellar CLI
        run: |
          VERSION="${{ steps.cli-version.outputs.version }}"
          if [[ -x "$HOME/.local/bin/stellar" ]]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            stellar --version
            exit 0
          fi

          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          mv stellar "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Install wasm-opt
        run: cargo install wasm-opt --locked

      - name: Build contract WASM (MVP-compatible)
        working-directory: neurowealth-vault
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/neurowealth-target
        run: |
          RUSTFLAGS="-C target-cpu=mvp" cargo build \
            -p neurowealth-vault \
            --target wasm32-unknown-unknown \
            --release

          WASM_DIR="${CARGO_TARGET_DIR:-target}/wasm32-unknown-unknown/release"
          WASM_FILE="$WASM_DIR/neurowealth_vault.wasm"
          wasm-opt --strip-target-features \
            "$WASM_FILE" \
            -o "$WASM_FILE"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/*.py

      - name: Run E2E devnet validation
        id: e2e
        run: |
          echo "::group::E2E Output"
          ./scripts/e2e-devnet.sh 2>&1 | tee scripts/e2e-artifacts/full_output.log
          echo "::endgroup::"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-devnet-artifacts
          path: scripts/e2e-artifacts/
          retention-days: 14

      - name: Retry cleanup for this run
        if: always()
        run: ./scripts/e2e-devnet.sh --cleanup "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Report failure details
        if: failure()
        run: |
          echo "## E2E Devnet Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -f scripts/e2e-artifacts/summary.txt ]]; then
            echo "### Scenario Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat scripts/e2e-artifacts/summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -f scripts/e2e-artifacts/contract_id.txt ]]; then
            CID=$(cat scripts/e2e-artifacts/contract_id.txt)
            echo "### References" >> $GITHUB_STEP_SUMMARY
            echo "- **Contract ID:** \`$CID\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Explorer:** [View on StellarExpert](https://stellar.expert/explorer/testnet/contract/$CID)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the uploaded **e2e-devnet-artifacts** for full logs and transaction details." >> $GITHUB_STEP_SUMMARY

      - name: Report success details
        if: success()
        run: |
          echo "## E2E Devnet Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -f scripts/e2e-artifacts/summary.txt ]]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat scripts/e2e-artifacts/summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [[ -f scripts/e2e-artifacts/contract_id.txt ]]; then
            CID=$(cat scripts/e2e-artifacts/contract_id.txt)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Contract ID:** \`$CID\`" >> $GITHUB_STEP_SUMMARY
          fi

  arithmetic-guard:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    name: Arithmetic overflow guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build artefacts
        uses: Swatinem/rust-cache@v2

      # Layer (a): Clippy forbids bare integer arithmetic operators.
      # -D turns the lint into a hard error; the build fails if any violation
      # is found.  This runs on ALL features so test helpers are also covered.
      - name: Clippy — forbid integer_arithmetic
        working-directory: neurowealth-vault/contracts/vault
        run: |
          cargo clippy \
            --all-features \
            -- \
            -D clippy::integer_arithmetic

      # Layer (b): Shell grep sweep for patterns Clippy can miss.
      # Checks:
      #   - No source-level #[allow(clippy::integer_arithmetic)] suppression
      #   - No .checked_*().unwrap() (must use .expect("msg"))
      #   - No silent 'as i128 / as u64 …' truncating casts in contract source
      - name: Shell arithmetic sweep
        working-directory: neurowealth-vault/contracts/vault
        run: bash scripts/check_arithmetic.sh

      # Summary is written to the GitHub Actions step summary by the script.

  a11y-playwright:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Accessibility Automated Tests (axe-core via Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium with system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Next.js application
        working-directory: frontend
        run: npm run build

      - name: Run axe-core accessibility tests
        working-directory: frontend
        run: npm run test:a11y

      - name: Upload Accessibility Report Artifacts (HTML + JSON)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-reports
          path: frontend/accessibility-reports/
          retention-days: 14


