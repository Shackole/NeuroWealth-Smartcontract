name: Staging Database Reset

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    name: Reset and reseed staging Supabase
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Reset staging database
        env:
          APP_ENV: staging
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: ./scripts/reset-staging-db.sh