name: Database migration upgrade

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/migrations/**'
      - '.github/workflows/migration-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  previous-schema-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply prior schema, upgrade twice, and verify records and objects
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: migration_fixture
        run: bash supabase/tests/migrations/previous-schema-upgrade.sh
