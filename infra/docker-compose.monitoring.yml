# NeuroWealth — Prometheus + Grafana Monitoring Stack
#
# Starts:
#   - Prometheus (scrapes the agent /metrics endpoint)
#   - Grafana    (provisioned with datasource + dashboards automatically)
#   - Alertmanager (receives alerts from Prometheus)
#
# Usage:
#   ./infra/monitoring-deployment.sh deploy /absolute/path/to/deployment-record
#
# Prerequisites:
#   - The Node.js agent must be running and exposing /metrics
#   - Set AGENT_HOST below (or export it as an environment variable)
#     to the hostname/IP reachable from inside the Docker network.
#
# Dashboard JSON files are read from docs/grafana/ and mounted into
# Grafana at /etc/grafana/dashboards. Any JSON file dropped there will be
# auto-imported on Grafana startup (and hot-reloaded every 30 s).

version: "3.9"

x-restart: &restart-policy
  restart: unless-stopped

networks:
  monitoring:
    name: neurowealth_monitoring

volumes:
  prometheus_data: {}
  alertmanager_data: {}
  grafana_data: {}

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    labels:
      org.neurowealth.monitoring.config-sha256: "${MONITORING_CONFIG_SHA256:-unrecorded}"
    image: prom/prometheus:v2.51.0
    <<: *restart-policy
    logging: *bounded-logging
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      # Main scrape config
      - ${MONITORING_CONFIG_DIR:-.}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules
      - ${MONITORING_CONFIG_DIR:-.}/rules:/etc/prometheus/rules:ro
      # Persistent TSDB storage
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    environment:
      # These are substituted into prometheus.yml via envsubst or directly
      # if you use --enable-feature=expand-external-labels
      AGENT_HOST: "${AGENT_HOST:-host.docker.internal}"
      AGENT_PORT: "${AGENT_PORT:-3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── RPC TLS certificate expiry exporter (#788) ────────────────────────────
  # Probes the configured Soroban RPC endpoint(s) and exposes certificate
  # expiry metrics on :9469 for the rpc_tls_certificate Prometheus job.
  rpc-tls-exporter:
    build:
      context: ./metrics
    <<: *restart-policy
    logging: *bounded-logging
    cpus: "0.25"
    mem_limit: 64m
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    networks: [monitoring]
    ports:
      - "9469:9469"
    environment:
      RPC_TLS_ENDPOINTS: "${RPC_TLS_ENDPOINTS:-${SOROBAN_RPC_URL:-https://soroban.stellar.org}}"
      RPC_TLS_PROBE_INTERVAL_SECONDS: "${RPC_TLS_PROBE_INTERVAL_SECONDS:-300}"
      RPC_TLS_WARNING_DAYS: "${RPC_TLS_WARNING_DAYS:-21}"
      RPC_TLS_CRITICAL_DAYS: "${RPC_TLS_CRITICAL_DAYS:-7}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9469/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── Alertmanager ───────────────────────────────────────────────────────────
  alertmanager:
    labels:
      org.neurowealth.monitoring.config-sha256: "${MONITORING_CONFIG_SHA256:-unrecorded}"
    image: prom/alertmanager:v0.27.0
    <<: *restart-policy
    logging: *bounded-logging
    cpus: "0.5"
    mem_limit: 128m
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks: [monitoring]
    ports:
      - "9093:9093"
    volumes:
      - ${MONITORING_CONFIG_DIR:-.}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--data.retention=120h"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    labels:
      org.neurowealth.monitoring.config-sha256: "${MONITORING_CONFIG_SHA256:-unrecorded}"
    image: grafana/grafana:10.4.2
    <<: *restart-policy
    logging: *bounded-logging
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [monitoring]
    ports:
      - "3030:3000"
    volumes:
      # Provisioning: datasources and dashboard discovery
      - ${MONITORING_CONFIG_DIR:-.}/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON files (hot-reloaded every 30 s)
      - ${MONITORING_DASHBOARDS_DIR:-../docs/grafana}:/etc/grafana/dashboards:ro
      # Persistent Grafana state (plugins, preferences, alert history)
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3030}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: "warn"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
